name: Internship alert

on:
  schedule:
    # Every 6 hours UTC — adjust as you like (GitHub may delay ±~1h on free tier)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

# Use Node 24 for JS-based actions (avoids Node 20 deprecation warnings on runners).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      # Fail fast with a clear message if repository secrets are missing or misnamed.
      - name: Check SMTP secrets exist
        env:
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          err=0
          if [ -z "$ALERT_EMAIL_FROM" ]; then echo "::error::Secret ALERT_EMAIL_FROM is empty. Add it under Settings → Secrets and variables → Actions (Repository secrets, exact name)."; err=1; fi
          if [ -z "$SMTP_USER" ]; then echo "::error::Secret SMTP_USER is empty. Same place; must be your Gmail address."; err=1; fi
          if [ -z "$SMTP_PASSWORD" ]; then echo "::error::Secret SMTP_PASSWORD is empty. Use a Gmail App Password, not your normal password."; err=1; fi
          exit $err

      - name: Run notifier
        env:
          # Comma-separated; all get the same alert email
          ALERT_EMAIL_TO: haalmasr@ualberta.ca,arnogl.fosh@gmail.com
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python notify.py

      - name: Commit seen state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --staged --quiet; then
            echo "No state change."
          else
            git commit -m "chore: update seen internship ids [skip ci]"
            git push
          fi
